on:
  push:
    branches:
      - main
      - release/*

jobs:
  setup-node:
    name: Setup Node.js environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      # Example step: install dependencies
      - name: Install dependencies
        run: npm ci

      # Example step: run tests
      - name: Run tests
        run: npm test
